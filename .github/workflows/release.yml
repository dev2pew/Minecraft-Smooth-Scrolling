name: Release test build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact mod_version from gradle.properties, for example 2.3.1-rpcompat.3"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: smooth-scroll-rpcompat-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish prerelease
    runs-on: ubuntu-latest

    steps:
      - name: Restrict release branches
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/heads/backport/1.21.8-resourcepack-compat|refs/heads/fix/1.21.8-rpcompat-tiling)
              ;;
            *)
              echo "::error::Run test releases only from the 1.21.8 resource-pack compatibility branches."
              echo "::error::Selected ref: $GITHUB_REF"
              exit 1
              ;;
          esac

      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"
          PROJECT_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"

          if [[ -z "$PROJECT_VERSION" ]]; then
            echo "::error::mod_version was not found in gradle.properties."
            exit 1
          fi

          if [[ "$VERSION" != "$PROJECT_VERSION" ]]; then
            echo "::error::Requested version $VERSION does not match mod_version=$PROJECT_VERSION."
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rpcompat\.[0-9]+$ ]]; then
            echo "::error::This workflow only publishes rpcompat prereleases."
            exit 1
          fi

          TAG="v$VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Find release JAR
        id: jar
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t JARS < <(
            find build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              ! -name '*-dev.jar' \
              | sort
          )

          if [[ "${#JARS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one release JAR, found ${#JARS[@]}."
            printf '%s\n' "${JARS[@]}"
            exit 1
          fi

          echo "jar=${JARS[0]}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.jar.outputs.jar }}#Fabric mod JAR" \
            --target "$GITHUB_SHA" \
            --title "Smooth Scroll ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --prerelease
